# Based on the multi-pack monorepo example in nono's Publishing Packs docs
# (Apache-2.0): https://nono.sh/docs/cli/features/package-publishing
# Modified: pack name and paths, pinned actions and nono version, no
# persisted checkout credentials, a check that the tag matches the
# package.json version, and a GitHub environment for publishing.
name: Publish claude-hardened pack
on:
  push:
    tags: ["claude-hardened-v*"]
  workflow_dispatch:

# OIDC identity matches this exact file path and environment; the trusted
# publisher entry is pinned to the same.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nono-registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version from package.json
        id: version
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' claude-hardened/package.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "ERROR: claude-hardened/package.json is missing a 'version' field"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag matches package.json version
        env:
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          EXPECTED="claude-hardened-v${VERSION}"
          if [ "$REF_NAME" != "$EXPECTED" ]; then
            echo "ERROR: ref '$REF_NAME' does not match package.json version (expected '$EXPECTED')"
            exit 1
          fi

      - name: Build files list from package.json
        id: files
        run: |
          set -euo pipefail
          {
            echo "package.json"
            [ -f "claude-hardened/README.md" ] && echo "README.md"
            jq -r '.artifacts[].path' "claude-hardened/package.json"
          } | sort -u > /tmp/files.txt
          {
            echo "files<<EOF"
            cat /tmp/files.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: nolabs-ai/agent-sign@a3641a5e9f14fdfc7d12bacec63d5f56f4fa1749 # v0.1.0
        with:
          publish: "true"
          package-name: claude-hardened
          package-namespace: hackebrot
          package-version: ${{ steps.version.outputs.version }}
          package-path: claude-hardened
          nono-version: v0.80.0
          registry-url: https://registry.nono.sh/api/v1
          files: ${{ steps.files.outputs.files }}
